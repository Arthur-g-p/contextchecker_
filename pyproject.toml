[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextchecker"
version = "0.5.0"
description = "A framework for evaluating LLM-generated knowledge graphs against ground truth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Arthur" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
eval = [
    # GPU-accelerated evaluation dependencies go here
    # e.g. "torch>=2.0", "transformers>=4.30"
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage>=7.0",
]

[project.scripts]
contextchecker = "contextchecker.cli:app"

[project.urls]
Homepage = "https://github.com/Arthur/contextchecker"
Repository = "https://github.com/Arthur/contextchecker"
Issues = "https://github.com/Arthur/contextchecker/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/contextchecker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests against CLI entrypoints",
    "integration: Integration tests for service layer",
    "unit: Unit tests for pure helper functions",
]

[tool.coverage.run]
source = ["contextchecker"]

[tool.coverage.report]
show_missing = true
skip_empty = true
