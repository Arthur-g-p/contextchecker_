[project]
name = "claimlens"
version = "0.5.0"
description = "A framework for evaluating LLM contexts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "tqdm>=4.60",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage>=7.0",
]

[project.scripts]
claimlens = "claimlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: Integration tests for service layer",
    "unit: Unit tests for pure helper functions",
]
